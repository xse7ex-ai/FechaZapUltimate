<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agente IA - PWA</title>
  
  <!-- Configurações PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agente IA">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white font-sans antialiased">
  <!-- Cabeçalho -->
  <header class="w-full border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="h-8 w-8 rounded-lg bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Agente IA PWA</span>
      </div>
      <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        Online
      </span>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="w-full max-w-md mx-auto px-4 py-6 flex-1 flex flex-col justify-center">
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-2xl backdrop-blur-sm">
      <div class="mb-5">
        <h1 class="text-xl font-bold text-white tracking-tight">Disparar Agente</h1>
        <p class="text-xs text-slate-400 mt-1">Envie comandos autônomos diretamente para o repositório GitHub.</p>
      </div>

      <form id="agenteForm" class="space-y-4">
        <!-- Input Projeto / Repositório -->
        <div>
          <label for="projeto_nome" class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1.5">
            Nome do Projeto / Repositório
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
              </svg>
            </div>
            <input 
              type="text" 
              id="projeto_nome" 
              name="projeto_nome" 
              required 
              placeholder="ex: xse7ex-ai/FechaZapUltimate"
              class="w-full bg-slate-950 border border-slate-700/80 rounded-xl pl-9 pr-3 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all"
            />
          </div>
        </div>

        <!-- Textarea Tarefa -->
        <div>
          <label for="tarefa" class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1.5">
            Instrução da Tarefa
          </label>
          <textarea 
            id="tarefa" 
            name="tarefa" 
            rows="4" 
            required 
            placeholder="Descreva a tarefa detalhadamente para o agente autônomo executar..."
            class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all resize-none"
          ></textarea>
        </div>

        <!-- Botão de Envio -->
        <button 
          type="submit" 
          id="btnSubmit" 
          class="w-full py-3 px-4 bg-brand-600 hover:bg-brand-500 active:bg-brand-700 text-white font-medium text-sm rounded-xl transition duration-150 shadow-lg shadow-brand-600/30 flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span>Enviar para o Agente</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>
      </form>

      <!-- Feedback de Carregamento (Trabalhando...) -->
      <div id="loadingStatus" class="hidden mt-5 p-4 rounded-xl bg-slate-950/80 border border-brand-500/40 text-center">
        <div class="flex items-center justify-center gap-3">
          <svg class="animate-spin h-5 w-5 text-brand-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
          <span class="text-sm font-semibold text-brand-400 animate-pulse">Trabalhando no código...</span>
        </div>
        <p class="text-xs text-slate-400 mt-2">O agente está processando a requisição e aplicando as alterações no GitHub.</p>
      </div>

      <!-- Caixa de Resposta / Resultado -->
      <div id="resultadoBox" class="hidden mt-5 p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-3">
        <div class="flex items-center gap-2 text-emerald-400">
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
          <span class="text-xs font-semibold uppercase tracking-wider">Execução Concluída</span>
        </div>
        
        <p id="resultadoMensagem" class="text-xs text-slate-300 leading-relaxed"></p>

        <!-- Link para o Github -->
        <a 
          id="githubLink" 
          href="#" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="inline-flex items-center justify-center gap-2 w-full py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-100 rounded-lg text-xs font-medium border border-slate-700 transition"
        >
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          <span id="githubLinkTexto">Ver no GitHub</span>
        </a>
      </div>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="w-full text-center py-4 text-xs text-slate-500 border-t border-slate-900">
    Agente Autônomo &copy; 2025 • Modo PWA Mobile-First
  </footer>

  <!-- Script Interceptador e Chamada da API -->
  <script>
    const form = document.getElementById('agenteForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const loadingStatus = document.getElementById('loadingStatus');
    const resultadoBox = document.getElementById('resultadoBox');
    const resultadoMensagem = document.getElementById('resultadoMensagem');
    const githubLink = document.getElementById('githubLink');
    const githubLinkTexto = document.getElementById('githubLinkTexto');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const projeto_nome = document.getElementById('projeto_nome').value.trim();
      const tarefa = document.getElementById('tarefa').value.trim();

      if (!projeto_nome || !tarefa) {
        alert('Por favor, preencha todos os campos.');
        return;
      }

      // Atualiza interface para estado "Trabalhando..."
      btnSubmit.disabled = true;
      loadingStatus.classList.remove('hidden');
      resultadoBox.classList.add('hidden');

      const payload = {
        projeto_nome: projeto_nome,
        tarefa: tarefa
      };

      try {
        const response = await fetch('https://axcrzutudtlskzbxttpm.supabase.co/functions/v1/Agente_IA', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json().catch(() => null);

        // Define a URL do GitHub com fallback inteligente
        let urlDestino = `https://github.com/${projeto_nome}`;
        if (data && (data.github_url || data.url || data.html_url || data.link)) {
          urlDestino = data.github_url || data.url || data.html_url || data.link;
        }

        let mensagem = 'A tarefa foi enviada e processada com sucesso pelo Agente IA!';
        if (data && (data.mensagem || data.message || data.status)) {
          mensagem = data.mensagem || data.message || data.status;
        }

        resultadoMensagem.textContent = typeof mensagem === 'object' ? JSON.stringify(mensagem) : mensagem;
        githubLink.href = urlDestino;
        githubLinkTexto.textContent = `Acessar ${urlDestino.replace('https://github.com/', '')}`;

        resultadoBox.classList.remove('hidden');
      } catch (error) {
        console.error('Erro na requisição:', error);
        resultadoMensagem.textContent = 'Erro ao se comunicar com o Agente IA: ' + error.message;
        githubLink.href = `https://github.com/${projeto_nome}`;
        githubLinkTexto.textContent = `Acessar ${projeto_nome} no GitHub`;
        resultadoBox.classList.remove('hidden');
      } finally {
        btnSubmit.disabled = false;
        loadingStatus.classList.add('hidden');
      }
    });

    // Registro do Service Worker para PWA (se suportado)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.log('ServiceWorker registration falhou ou sw.js não encontrado:', err);
        });
      });
    }
  </script>
</body>
</html>
