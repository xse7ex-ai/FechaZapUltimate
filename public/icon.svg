<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6" />

  <!-- Modern Lightning Zap with Dynamic Angle -->
  <g filter="url(#shadow)">
    <!-- Central Lightning Bolt (FechaZap ⚡) -->
    <path
      d="M285 64 L160 272 L252 272 L215 448 L356 236 L264 236 Z"
      fill="url(#boltGrad)"
      stroke="#ffffff"
      stroke-width="8"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
  </g>

  <!-- Small WhatsApp/Receipt Accent dot in emerald dark corner -->
  <circle cx="396" cy="396" r="38" fill="#047857" stroke="#ffffff" stroke-width="6" />
  <path d="M380 396 L392 408 L414 384" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>
